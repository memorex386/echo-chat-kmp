# Tests the shared code on the JVM and in headless Chrome, and only if they pass, publishes the
# web app to GitHub Pages (D36). The iOS tests stay on the Mac, and Android's on a device.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, so an older run can't replace a newer page.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test on the JVM and in headless Chrome, then build the web app
        run: ./gradlew jvmTest wasmJsBrowserTest :webApp:wasmJsBrowserDistribution
      # The run's log names a failed test but not why. Its report and result files have the error.
      - name: Keep the test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub can take longer than the action's 10 minutes to publish (D36).
          timeout: 1200000
